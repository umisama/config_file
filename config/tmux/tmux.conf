# ===========================================================================
# byobu 風の tmux 設定
#   F キー操作は byobu と同じ。Shift-F12 で F キーの横取りを ON/OFF（Neovim の F1-F4 を使うとき等）
#   prefix は C-a（byobu の screen モード）と F12。C-a C-a で直前のウィンドウ、C-a a で中のアプリに C-a
# ===========================================================================

# --- 端末 / 色 ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -sg escape-time 10
set -g focus-events on
# Shift+Enter などを Enter と区別して中のアプリ（Claude Code / Codex）へ渡す
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# 中のアプリからの通知などを外側の端末へ通す
set -g allow-passthrough on
set -g xterm-keys on

# --- 基本 ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g monitor-activity on
set -g visual-activity off
set -g set-titles on
set -g set-titles-string "#S:#I #W"

# 以前の設定で使っていたキー（起動中のサーバーで再読み込みしても残らないように外す）
unbind -q -n M-F3
unbind -q -n M-F4

# --- prefix ---
unbind -q C-b
set -g prefix C-a
set -g prefix2 F12
bind F12 send-prefix -2

# --- screen 互換（prefix の後のキーは Ctrl を押したままでも離しても同じ） ---
bind C-a last-window                                           # 直前のウィンドウと行き来
bind a   send-prefix                                           # 中のアプリに C-a を送る（zsh なら行頭へ）
bind C-c new-window -c "#{pane_current_path}"
bind C-n next-window
bind C-p previous-window
bind Space next-window
bind C-Space next-window
bind BSpace previous-window
bind C-d detach-client
bind C-w choose-tree -Zw                                       # ウィンドウ一覧（w / " も同じ）
bind '"' choose-tree -Zw
bind A   command-prompt -I "#W" "rename-window -- '%%'"        # ウィンドウ名の変更（, も同じ）
bind C-k confirm-before -p "ウィンドウ #W を閉じますか？ (y/n)" kill-window
bind K   confirm-before -p "ウィンドウ #W を閉じますか？ (y/n)" kill-window
bind S   split-window -v -c "#{pane_current_path}"             # 上下に分割
bind Tab select-pane -t :.+                                    # 次のペインへ
bind X   confirm-before -p "このペインを閉じますか？ (y/n)" kill-pane
bind Q   confirm-before -p "このペイン以外を閉じますか？ (y/n)" "kill-pane -a"
bind Escape copy-mode
bind C-[ copy-mode
bind C-] paste-buffer

# --- byobu 互換の F キー ---
bind -n F2      new-window -c "#{pane_current_path}"
bind -n S-F2    split-window -v -c "#{pane_current_path}"      # 上下に分割
bind -n C-F2    split-window -h -c "#{pane_current_path}"      # 左右に分割
bind -n C-S-F2  new-session
bind -n F3      previous-window
bind -n F4      next-window
bind -n S-F3    select-pane -t :.-
bind -n S-F4    select-pane -t :.+
bind -n C-F3    swap-pane -U
bind -n C-F4    swap-pane -D
bind -n C-S-F3  swap-window -d -t -1                           # ウィンドウを左へ
bind -n C-S-F4  swap-window -d -t +1                           # ウィンドウを右へ
# ※ Alt-F4 は Windows がウィンドウを閉じるので使わない（セッション切替は Alt-↑/↓）
bind -n F5      source-file ~/.config/tmux/tmux.conf \; display "tmux.conf を再読み込みしました"
bind -n F6      detach-client
bind -n S-F6    detach-client
bind -n M-F6    detach-client -a \; display "他のクライアントをデタッチしました"
bind -n C-F6    confirm-before -p "このペインを閉じますか？ (y/n)" kill-pane
bind -n F7      copy-mode
bind -n F8      command-prompt -I "#W" "rename-window -- '%%'"
bind -n C-F8    command-prompt -I "#S" "rename-session -- '%%'"
bind -n S-F8    next-layout
# 全ウィンドウ / 全ペインにコマンドを送る（入力はシェルを通さず、そのまま送る）
bind -n C-F9    command-prompt -p "全ウィンドウで実行:" 'set -g @broadcast "%%%" ; run-shell -b "~/.config/tmux/broadcast.sh windows #{q:session_id}"'
bind -n S-F9    command-prompt -p "全ペインで実行:" 'set -g @broadcast "%%%" ; run-shell -b "~/.config/tmux/broadcast.sh panes #{q:window_id}"'
bind -n M-F9    setw synchronize-panes \; display "全ペイン同時入力: #{?pane_synchronized,ON,OFF}"
bind -n F11     resize-pane -Z
bind -n S-F11   resize-pane -Z
bind -n C-F11   join-pane -h -s :. -t :-1                      # このウィンドウを前のウィンドウに分割として取り込む
bind -n M-F11   break-pane                                     # このペインを独立したウィンドウに
bind -n M-F12   set -g mouse \; display "マウス: #{?mouse,ON,OFF}"

# Alt + 矢印: ウィンドウ / セッション移動、Shift + 矢印: ペイン移動、Shift-Alt + 矢印: リサイズ
bind -n M-Left    previous-window
bind -n M-Right   next-window
bind -n M-Up      switch-client -p
bind -n M-Down    switch-client -n
bind -n S-Left    select-pane -L
bind -n S-Right   select-pane -R
bind -n S-Up      select-pane -U
bind -n S-Down    select-pane -D
bind -n M-S-Left  resize-pane -L 3
bind -n M-S-Right resize-pane -R 3
bind -n M-S-Up    resize-pane -U 2
bind -n M-S-Down  resize-pane -D 2
# Alt-PageUp でスクロールバックへ
bind -n M-PPage   copy-mode -u

# Shift-F12: F キー等の横取りを止める（中のアプリにそのまま渡す）/ 元に戻す
bind -n S-F12 set key-table off \; set prefix None \; set prefix2 None \; refresh-client -S
bind -T off S-F12 set -u key-table \; set prefix C-a \; set prefix2 F12 \; refresh-client -S

# --- prefix 経由（従来の操作も残す） ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf を再読み込みしました"

# --- コピー: vi キー + OSC 52 で Windows / ローカルのクリップボードへ ---
setw -g mode-keys vi
set -s set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- byobu 風ステータスバー ---
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[bg=colour202,fg=colour231,bold] #S #[bg=colour238,fg=colour252,nobold] #h "
set -g status-right "#{?#{==:#{client_key_table},off},#[bg=colour160 fg=colour231 bold] F-KEYS OFF #[default],}#{?client_prefix,#[bg=colour226 fg=colour16 bold] PREFIX #[default],}#{?pane_synchronized,#[bg=colour129 fg=colour231 bold] SYNC #[default],}#[bg=colour238,fg=colour252] #(~/.config/tmux/status.sh load) #[bg=colour24,fg=colour231] #(~/.config/tmux/status.sh mem) #[bg=colour236,fg=colour250] %m/%d %H:%M "
setw -g window-status-separator ""
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format "#[bg=colour31,fg=colour231,bold] #I:#W#F "
setw -g window-status-activity-style "fg=colour214"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"
set -g message-style "bg=colour31,fg=colour231"

# マシン固有の設定
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"
