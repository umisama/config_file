# 言語ランタイムと CLI ツール（`mise install` / 更新は `mise upgrade`）
[tools]
# Neovim（apt 版は 0.11 で、nvim-treesitter の main ブランチが要求する 0.12 に足りない）
neovim = "latest"
node = "lts"
go = "latest"
python = "latest"
# ソースからビルドする（依存は packages/apt.txt）
php = "8.4"
# Neovim の nvim-treesitter（main）がパーサのビルドに使う
tree-sitter = "latest"
# Codex CLI
"npm:@openai/codex" = "latest"
gh = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
uv = "latest"
# Cloudflare CLI（Workers / Pages など）
"npm:wrangler" = "latest"

[env]
# vfox-php は Linux で sodium / gmp や GD の FreeType・JPEG・WebP 対応を有効にしないので、configure に追加する
PHP_EXTRA_CONFIGURE_OPTIONS = "--with-sodium --with-gmp --with-freetype --with-jpeg --with-webp"
